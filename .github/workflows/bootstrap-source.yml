name: Import verified starter source
on:
  push:
    paths:
      - source-bundle.b64
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and run tests
        run: |
          base64 --decode source-bundle.b64 > /tmp/pulse-source.tar.gz
          tar -xzf /tmp/pulse-source.tar.gz
          python3 -m unittest discover -s tests -v
          python3 build.py --fetch
      - name: Commit site generator and generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.py ai_draft.py config.json assets tests .github/workflows/update-feed.yml .gitignore public
          if ! git diff --cached --quiet; then
            git commit -m 'site: import CalculatedIT Threat Pulse source and branded pages'
            git push
          else
            echo 'No changes to commit'
          fi