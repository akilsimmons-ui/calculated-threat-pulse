name: Import CalculatedIT Threat Pulse deployment kit
on:
  push:
    paths:
      - 'CalculatedIT_Threat_Pulse_Branded_Deployment_Kit.zip'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract branded website and verify source
        run: |
          test -f CalculatedIT_Threat_Pulse_Branded_Deployment_Kit.zip
          unzip -o CalculatedIT_Threat_Pulse_Branded_Deployment_Kit.zip
          python3 -m unittest discover -s tests -v
          python3 build.py --fetch
      - name: Commit site source and pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/update-feed.yml
          git add .gitignore README.md build.py ai_draft.py config.json assets tests data/kev.json
          git add -f public
          git rm -f CalculatedIT_Threat_Pulse_Branded_Deployment_Kit.zip
          if ! git diff --cached --quiet; then
            git commit -m 'site: import CalculatedIT Threat Pulse website and tools'
            git push
          else
            echo 'No changes to commit.'
          fi