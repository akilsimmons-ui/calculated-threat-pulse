name: Refresh official security intelligence feed
on:
  push:
    paths:
      - '.github/workflows/update-feed.yml'
      - 'build.py'
      - 'site_rollups.py'
      - 'cve_pages.py'
      - 'config.json'
      - 'tests/**'
      - 'assets/**'
      - 'content/**'
  workflow_dispatch:
  schedule:
    - cron: '21 6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate CISA data
        run: |
          python build.py --fetch
          python -m unittest discover -s tests -v
      - name: Commit feed and rebuilt pages when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kev.json
          git add -f public
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh CISA known exploited vulnerabilities'
            git push
          else
            echo 'No change to publish.'
          fi